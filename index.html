<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreo idCIF - YODA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #1BB489;
            margin-bottom: 10px;
        }
        .logo span {
            background: #1BB489;
            color: white;
            padding: 4px 12px;
            border-radius: 50%;
            display: inline-block;
            width: 48px;
            height: 48px;
            line-height: 48px;
            text-align: center;
            font-size: 20px;
        }
        h2 {
            color: #1a1a2e;
            margin-bottom: 8px;
            font-size: 22px;
        }
        .subtext {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border 0.3s;
            background: #fafafa;
        }
        input:focus {
            outline: none;
            border-color: #1BB489;
            background: white;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #1BB489;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .status.loading {
            display: flex;
            background: #e3f2fd;
            color: #0d47a1;
            border-left: 4px solid #0d47a1;
        }
        .status.success {
            display: flex;
            background: #e8f5e9;
            color: #1b5e20;
            border-left: 4px solid #1b5e20;
        }
        .status.error {
            display: flex;
            background: #ffebee;
            color: #b71c1c;
            border-left: 4px solid #b71c1c;
        }
        .status.waiting {
            display: flex;
            background: #fff3e0;
            color: #e65100;
            border-left: 4px solid #e65100;
        }
        .status.info {
            display: flex;
            background: #e8eaf6;
            color: #283593;
            border-left: 4px solid #283593;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #1BB489;
            display: none;
            word-wrap: break-word;
        }
        .result-box.show {
            display: block;
        }
        .result-box h3 {
            color: #1a1a2e;
            margin-bottom: 10px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-box pre {
            white-space: pre-wrap;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            max-height: 500px;
            overflow-y: auto;
            margin: 0;
        }
        .result-box .timestamp {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            text-align: right;
        }
        .divider {
            border: none;
            border-top: 2px solid #eef2f7;
            margin: 25px 0;
        }
        .credential-hint {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 8px;
        }
        .gradient-bar {
            height: 6px;
            background: linear-gradient(90deg, purple, blue, teal, #1a1a2e, orange, teal, pink);
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            background: #1BB489;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: normal;
        }
        .monitor-info {
            font-size: 13px;
            color: #666;
            background: #f0f4f8;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
        }
        .monitor-info.show {
            display: block;
        }
        .monitor-info strong {
            color: #1a1a2e;
        }
        .check-anim {
            display: inline-block;
            animation: popIn 0.5s ease;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <span>Y</span> YODA
    </div>
    <div class="gradient-bar"></div>

    <h2>🔍 Rastreo idCIF</h2>
    <p class="subtext">Ingresa el CURP o RFC para consultar</p>

    <hr class="divider">

    <form id="mainForm">
        <div class="form-group">
            <label>📋 CURP o RFC <span class="badge">obligatorio</span></label>
            <input type="text" id="curp_rfc" placeholder="Ej: GODE561231HDF" required autofocus>
        </div>
        <button type="submit" class="btn" id="submitBtn">🚀 Comenzar rastreo</button>
    </form>

    <div id="status" class="status"></div>
    <div id="monitorInfo" class="monitor-info">
        <span>🔄 <strong>Monitoreo activo</strong> — La página se actualizará automáticamente</span>
        <br>
        <span style="font-size:12px;color:#888;">⏱️ Tiempo en espera: <span id="timerDisplay">00:00:00</span></span>
    </div>

    <div id="resultBox" class="result-box">
        <h3>📊 Resultado del rastreo</h3>
        <div id="resultContent"></div>
        <div class="timestamp" id="resultTimestamp"></div>
    </div>

    <p class="credential-hint">🔐 Acceso automático con credenciales precargadas</p>
</div>

<script>
    // ============================================================
    // CONFIGURACIÓN
    // ============================================================
    const CONFIG = {
        email: 'damaris21@gmail.com',
        password: 'D2026',
        // Las URLs ahora apuntan a tu proxy en Render
        API_BASE: window.location.origin, // O usa la URL de Render
    };

    // ============================================================
    // VARIABLES DE CONTROL
    // ============================================================
    let monitorInterval = null;
    let tiempoEspera = 0;
    let timerInterval = null;
    let sesionActiva = false;
    let cookies = ''; // Guardar cookies de sesión

    // ============================================================
    // FUNCIÓN: Petición al proxy
    // ============================================================
    async function apiCall(endpoint, options = {}) {
        const url = `${CONFIG.API_BASE}/api/${endpoint}`;
        const response = await fetch(url, {
            ...options,
            headers: {
                'Content-Type': 'application/json',
                ...(options.headers || {})
            }
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Error en la petición');
        }

        return await response.json();
    }

    // ============================================================
    // ENVÍO DEL FORMULARIO
    // ============================================================
    document.getElementById('mainForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const curpRfc = document.getElementById('curp_rfc').value.trim().toUpperCase();
        const btn = document.getElementById('submitBtn');

        if (!curpRfc || curpRfc.length < 10) {
            showStatus('⚠️ Ingresa un CURP o RFC válido (mínimo 10 caracteres)', 'error');
            return;
        }

        btn.disabled = true;
        btn.textContent = '⏳ Iniciando...';
        document.getElementById('resultBox').classList.remove('show');
        document.getElementById('monitorInfo').classList.remove('show');
        detenerMonitoreo();
        detenerTimer();

        try {
            // ============================================================
            // PASO 1: LOGIN
            // ============================================================
            showStatus('🔐 Iniciando sesión...', 'loading');

            const loginResult = await apiCall('login', {
                method: 'POST',
                body: JSON.stringify({
                    email: CONFIG.email,
                    password: CONFIG.password
                })
            });

            if (!loginResult.ok) {
                throw new Error('Credenciales incorrectas');
            }

            // Guardar cookies
            if (loginResult.cookies) {
                cookies = loginResult.cookies;
            }

            // ✅ AVISO 1: LOGIN EXITOSO
            showStatus('✅ <span class="check-anim">✔</span> LOGIN EXITOSO', 'success');
            await sleep(1500);

            // ============================================================
            // PASO 2: ACCEDER AL RASTREO
            // ============================================================
            showStatus('📂 Accediendo al apartado de rastreo...', 'loading');

            const rastreoGet = await apiCall('rastreo', {
                method: 'GET',
                headers: {
                    'Cookie': cookies
                }
            });

            if (!rastreoGet.ok) {
                throw new Error('No se pudo acceder al rastreo');
            }

            if (rastreoGet.cookies) {
                cookies = rastreoGet.cookies;
            }

            // ✅ AVISO 2: APARTADO DE RASTREO EXITOSO
            showStatus('✅ <span class="check-anim">✔</span> APARTADO DE RASTREO EXITOSO', 'info');
            await sleep(1500);

            // ============================================================
            // PASO 3: EXTRAER TOKEN Y ENVIAR CURP/RFC
            // ============================================================
            showStatus('📤 Enviando CURP/RFC: ' + curpRfc, 'loading');

            // Extraer token del HTML
            const tokenMatch = rastreoGet.body.match(/name="(?:csrf|_token|token)"\s+value="([^"]+)"/i);
            const token = tokenMatch ? tokenMatch[1] : '';

            // Extraer campos ocultos
            const hiddenFields = {};
            const hiddenRegex = /<input[^>]*type="hidden"[^>]*name="([^"]+)"[^>]*value="([^"]*)"[^>]*>/gi;
            let match;
            while ((match = hiddenRegex.exec(rastreoGet.body)) !== null) {
                if (match[1] !== 'csrf' && match[1] !== '_token' && match[1] !== 'token') {
                    hiddenFields[match[1]] = match[2];
                }
            }

            const rastreoPost = await apiCall('rastreo', {
                method: 'POST',
                headers: {
                    'Cookie': cookies
                },
                body: JSON.stringify({
                    curp_rfc: curpRfc,
                    token: token,
                    ...hiddenFields
                })
            });

            if (!rastreoPost.ok) {
                throw new Error('Error al enviar CURP/RFC');
            }

            if (rastreoPost.cookies) {
                cookies = rastreoPost.cookies;
            }

            // ============================================================
            // PASO 4: VERIFICAR RESULTADO
            // ============================================================
            const resultadoExtraido = extraerResultado(rastreoPost.body);

            if (resultadoExtraido) {
                mostrarResultado(resultadoExtraido);
                showStatus('✅ Rastreo completado', 'success');
                btn.textContent = '✅ Completado';
            } else {
                showStatus('⏳ En espera de resultados...', 'waiting');
                btn.textContent = '⏳ En espera...';
                document.getElementById('monitorInfo').classList.add('show');
                iniciarTimer();
                iniciarMonitoreo();
                sesionActiva = true;
            }

        } catch (error) {
            showStatus('❌ Error: ' + error.message, 'error');
            console.error('Error:', error);
            btn.textContent = '🚀 Reintentar';
            btn.disabled = false;
        }
    });

    // ============================================================
    // FUNCIÓN: Monitoreo
    // ============================================================
    function iniciarMonitoreo() {
        detenerMonitoreo();

        monitorInterval = setInterval(async () => {
            try {
                const rastreoGet = await apiCall('rastreo', {
                    method: 'GET',
                    headers: {
                        'Cookie': cookies
                    }
                });

                if (rastreoGet.ok) {
                    const resultado = extraerResultado(rastreoGet.body);
                    if (resultado) {
                        mostrarResultado(resultado);
                        showStatus('✅ ¡Resultado obtenido!', 'success');
                        detenerMonitoreo();
                        detenerTimer();
                        document.getElementById('monitorInfo').classList.remove('show');
                    } else {
                        actualizarTimer();
                    }
                }
            } catch (e) {
                console.log('Monitoreo:', e.message);
            }
        }, 5000);
    }

    // ============================================================
    // FUNCIÓN: Extraer resultado
    // ============================================================
    function extraerResultado(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        const selectores = [
            '.resultado', '#resultado', '.result', '#result',
            '.card-body', '.content', 'table',
            '.alert-success', '.alert-info',
            '[class*="result"]', '[id*="result"]',
            '.mensaje', '#mensaje', '.datos', '#datos'
        ];

        for (const selector of selectores) {
            const elem = doc.querySelector(selector);
            if (elem) {
                const texto = elem.textContent.trim();
                if (texto.length > 20 && !texto.includes('CURP') && !texto.includes('RFC')) {
                    return elem.innerHTML;
                }
                if (elem.tagName === 'TABLE' && elem.querySelectorAll('tr').length > 1) {
                    return elem.innerHTML;
                }
            }
        }

        return null;
    }

    // ============================================================
    // FUNCIÓN: Mostrar resultado
    // ============================================================
    function mostrarResultado(html) {
        const resultBox = document.getElementById('resultBox');
        const resultContent = document.getElementById('resultContent');
        const timestamp = document.getElementById('resultTimestamp');

        let limpio = html.replace(/<script[\s\S]*?<\/script>/gi, '');
        limpio = limpio.replace(/<style[\s\S]*?<\/style>/gi, '');

        resultContent.innerHTML = limpio || 'No se encontró información';
        resultBox.classList.add('show');
        timestamp.textContent = '📅 Resultado obtenido: ' + new Date().toLocaleString();

        detenerMonitoreo();
        detenerTimer();
        document.getElementById('monitorInfo').classList.remove('show');
        document.getElementById('submitBtn').textContent = '✅ Completado';
        document.getElementById('submitBtn').disabled = false;

        // Sonido
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 800;
            gain.gain.value = 0.1;
            osc.start();
            setTimeout(() => osc.stop(), 200);
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.frequency.value = 1000;
                gain2.gain.value = 0.1;
                osc2.start();
                setTimeout(() => osc2.stop(), 200);
            }, 300);
        } catch(e) {}
    }

    // ============================================================
    // FUNCIONES: Timer
    // ============================================================
    function iniciarTimer() {
        detenerTimer();
        tiempoEspera = 0;
        timerInterval = setInterval(() => {
            tiempoEspera++;
            actualizarTimer();
        }, 1000);
    }

    function actualizarTimer() {
        const hours = Math.floor(tiempoEspera / 3600);
        const minutes = Math.floor((tiempoEspera % 3600) / 60);
        const seconds = tiempoEspera % 60;
        document.getElementById('timerDisplay').textContent = 
            `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function detenerTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function detenerMonitoreo() {
        if (monitorInterval) {
            clearInterval(monitorInterval);
            monitorInterval = null;
        }
    }

    function showStatus(message, type) {
        const status = document.getElementById('status');
        status.innerHTML = message;
        status.className = 'status ' + type;
        if (type === 'loading' || type === 'waiting') {
            const spinner = document.createElement('span');
            spinner.className = 'spinner';
            status.prepend(spinner);
        }
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================
    console.log('🔍 Rastreo idCIF - YODA (con proxy)');
    document.getElementById('curp_rfc').focus();
</script>

</body>
</html>
