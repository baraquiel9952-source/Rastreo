<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreo idCIF - YODA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #1BB489;
            margin-bottom: 10px;
        }
        .logo span {
            background: #1BB489;
            color: white;
            padding: 4px 12px;
            border-radius: 50%;
            display: inline-block;
            width: 48px;
            height: 48px;
            line-height: 48px;
            text-align: center;
            font-size: 20px;
        }
        h2 {
            color: #1a1a2e;
            margin-bottom: 8px;
            font-size: 22px;
        }
        .subtext {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border 0.3s;
            background: #fafafa;
        }
        input:focus {
            outline: none;
            border-color: #1BB489;
            background: white;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #1BB489;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .status.loading {
            display: flex;
            background: #e3f2fd;
            color: #0d47a1;
            border-left: 4px solid #0d47a1;
        }
        .status.success {
            display: flex;
            background: #e8f5e9;
            color: #1b5e20;
            border-left: 4px solid #1b5e20;
        }
        .status.error {
            display: flex;
            background: #ffebee;
            color: #b71c1c;
            border-left: 4px solid #b71c1c;
        }
        .status.waiting {
            display: flex;
            background: #fff3e0;
            color: #e65100;
            border-left: 4px solid #e65100;
        }
        .status.info {
            display: flex;
            background: #e8eaf6;
            color: #283593;
            border-left: 4px solid #283593;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #1BB489;
            display: none;
            word-wrap: break-word;
        }
        .result-box.show {
            display: block;
        }
        .result-box h3 {
            color: #1a1a2e;
            margin-bottom: 10px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-box pre {
            white-space: pre-wrap;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            max-height: 500px;
            overflow-y: auto;
            margin: 0;
        }
        .result-box .timestamp {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            text-align: right;
        }
        .divider {
            border: none;
            border-top: 2px solid #eef2f7;
            margin: 25px 0;
        }
        .credential-hint {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 8px;
        }
        .gradient-bar {
            height: 6px;
            background: linear-gradient(90deg, purple, blue, teal, #1a1a2e, orange, teal, pink);
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            background: #1BB489;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: normal;
        }
        .monitor-info {
            font-size: 13px;
            color: #666;
            background: #f0f4f8;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
        }
        .monitor-info.show {
            display: block;
        }
        .monitor-info strong {
            color: #1a1a2e;
        }
        /* Check verde animado */
        .check-anim {
            display: inline-block;
            animation: popIn 0.5s ease;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Logo YODA -->
    <div class="logo">
        <span>Y</span> YODA
    </div>

    <!-- Barra gradient -->
    <div class="gradient-bar"></div>

    <h2>🔍 Rastreo idCIF</h2>
    <p class="subtext">Ingresa el CURP o RFC para consultar</p>

    <hr class="divider">

    <!-- Formulario (solo CURP/RFC visible) -->
    <form id="mainForm">
        <div class="form-group">
            <label>📋 CURP o RFC <span class="badge">obligatorio</span></label>
            <input type="text" id="curp_rfc" placeholder="Ej: GODE561231HDF" required autofocus>
        </div>

        <button type="submit" class="btn" id="submitBtn">🚀 Comenzar rastreo</button>
    </form>

    <!-- Estado (aquí aparecerán los avisos) -->
    <div id="status" class="status"></div>

    <!-- Información de monitoreo -->
    <div id="monitorInfo" class="monitor-info">
        <span>🔄 <strong>Monitoreo activo</strong> — La página se actualizará automáticamente cuando el resultado esté listo</span>
        <br>
        <span style="font-size:12px;color:#888;">⏱️ Tiempo en espera: <span id="timerDisplay">00:00:00</span></span>
    </div>

    <!-- Resultado -->
    <div id="resultBox" class="result-box">
        <h3>📊 Resultado del rastreo</h3>
        <div id="resultContent"></div>
        <div class="timestamp" id="resultTimestamp"></div>
    </div>

    <p class="credential-hint">🔐 Acceso automático con credenciales precargadas</p>
</div>

<script>
    // ============================================================
    // CONFIGURACIÓN (CREDENCIALES PRECARGADAS)
    // ============================================================
    const CONFIG = {
        email: 'damaris21@gmail.com',      // <-- CORREO PRECARGADO
        password: 'D2026',                  // <-- CONTRASEÑA PRECARGADA
        loginUrl: 'https://validacion-4.byethost3.com/login/?i=1',
        rastreoUrl: 'https://validacion-4.byethost3.com/rastreo-seguro.php?i=1'
    };

    // ============================================================
    // VARIABLES DE CONTROL
    // ============================================================
    let monitorInterval = null;
    let tiempoEspera = 0;
    let timerInterval = null;
    let sesionActiva = false;
    let loginCompletado = false;
    let rastreoAccedido = false;

    // ============================================================
    // ENVÍO DEL FORMULARIO
    // ============================================================
    document.getElementById('mainForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const curpRfc = document.getElementById('curp_rfc').value.trim().toUpperCase();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        const resultBox = document.getElementById('resultBox');
        const resultContent = document.getElementById('resultContent');
        const monitorInfo = document.getElementById('monitorInfo');

        // Validar CURP/RFC
        if (!curpRfc) {
            showStatus('⚠️ Ingresa un CURP o RFC válido', 'error');
            return;
        }

        if (curpRfc.length < 10) {
            showStatus('⚠️ El CURP/RFC debe tener al menos 10 caracteres', 'error');
            return;
        }

        // Deshabilitar botón
        btn.disabled = true;
        btn.textContent = '⏳ Iniciando...';
        resultBox.classList.remove('show');
        resultContent.innerHTML = '';
        monitorInfo.classList.remove('show');
        loginCompletado = false;
        rastreoAccedido = false;

        // Detener monitoreo anterior
        detenerMonitoreo();
        detenerTimer();

        try {
            // ============================================================
            // PASO 1: LOGIN
            // ============================================================
            showStatus('🔐 Iniciando sesión como damaris21@gmail.com...', 'loading');

            const loginData = new FormData();
            loginData.append('email', CONFIG.email);
            loginData.append('password', CONFIG.password);

            const loginResp = await fetch(CONFIG.loginUrl, {
                method: 'POST',
                body: loginData,
                credentials: 'include',
                headers: {
                    'Accept': 'application/json, text/html'
                }
            });

            if (!loginResp.ok) {
                throw new Error('Error en login: ' + loginResp.status);
            }

            const loginText = await loginResp.text();
            let loginExitoso = false;

            try {
                const loginJson = JSON.parse(loginText);
                if (loginJson.error || loginJson.status === 'error') {
                    throw new Error(loginJson.message || 'Credenciales incorrectas');
                }
                if (loginJson.success || loginJson.status === 'success') {
                    loginExitoso = true;
                }
            } catch (e) {
                if (loginText.includes('rastreo') || 
                    loginText.includes('dashboard') || 
                    loginText.includes('bienvenido')) {
                    loginExitoso = true;
                } else if (loginText.includes('incorrecto') || loginText.includes('error')) {
                    throw new Error('Credenciales incorrectas');
                } else {
                    loginExitoso = true;
                }
            }

            if (!loginExitoso) {
                throw new Error('No se pudo iniciar sesión correctamente');
            }

            // ✅ AVISO 1: LOGIN EXITOSO
            loginCompletado = true;
            showStatus('✅ <span class="check-anim">✔</span> LOGIN EXITOSO — Sesión iniciada correctamente', 'success');
            
            // Esperar 1.5 segundos para que se vea el aviso
            await sleep(1500);

            // ============================================================
            // PASO 2: ACCEDER AL RASTREO
            // ============================================================
            showStatus('📂 Accediendo al apartado de rastreo...', 'loading');

            const rastreoResp = await fetch(CONFIG.rastreoUrl, {
                method: 'GET',
                credentials: 'include'
            });

            if (!rastreoResp.ok) {
                throw new Error('Error al cargar rastreo: ' + rastreoResp.status);
            }

            const rastreoHTML = await rastreoResp.text();

            // Verificar que estamos en la página de rastreo
            if (!rastreoHTML.includes('rastreo') && !rastreoHTML.includes('CURP') && !rastreoHTML.includes('RFC')) {
                throw new Error('No se pudo acceder al apartado de rastreo');
            }

            // ✅ AVISO 2: APARTADO DE RASTREO EXITOSO
            rastreoAccedido = true;
            showStatus('✅ <span class="check-anim">✔</span> APARTADO DE RASTREO EXITOSO — Página de consulta cargada', 'info');
            
            // Esperar 1.5 segundos para que se vea el aviso
            await sleep(1500);

            // ============================================================
            // PASO 3: EXTRAER TOKEN Y ENVIAR CURP/RFC
            // ============================================================
            showStatus('📤 Enviando CURP/RFC: ' + curpRfc, 'loading');

            // Extraer token CSRF si existe
            const tokenMatch = rastreoHTML.match(/name="(?:csrf|_token|token)"\s+value="([^"]+)"/i);
            const token = tokenMatch ? tokenMatch[1] : '';

            // Extraer campos ocultos
            const hiddenFields = [];
            const hiddenRegex = /<input[^>]*type="hidden"[^>]*name="([^"]+)"[^>]*value="([^"]*)"[^>]*>/gi;
            let match;
            while ((match = hiddenRegex.exec(rastreoHTML)) !== null) {
                if (match[1] !== 'csrf' && match[1] !== '_token' && match[1] !== 'token') {
                    hiddenFields.push({ name: match[1], value: match[2] });
                }
            }

            const formData = new FormData();
            formData.append('curp_rfc', curpRfc);
            if (token) formData.append('token', token);
            hiddenFields.forEach(f => formData.append(f.name, f.value));

            const rastreoPost = await fetch(CONFIG.rastreoUrl, {
                method: 'POST',
                body: formData,
                credentials: 'include'
            });

            if (!rastreoPost.ok) {
                throw new Error('Error al enviar CURP/RFC: ' + rastreoPost.status);
            }

            const resultadoHTML = await rastreoPost.text();

            // ============================================================
            // PASO 4: VERIFICAR SI HAY RESULTADO INMEDIATO
            // ============================================================
            const resultadoExtraido = extraerResultado(resultadoHTML);

            if (resultadoExtraido) {
                mostrarResultado(resultadoExtraido);
                showStatus('✅ Rastreo completado', 'success');
                btn.textContent = '✅ Completado';
            } else {
                // ============================================================
                // PASO 5: MODO ESPERA (pueden ser horas)
                // ============================================================
                showStatus('⏳ En espera de resultados... El proceso puede tardar minutos u horas', 'waiting');
                btn.textContent = '⏳ En espera...';
                
                monitorInfo.classList.add('show');
                iniciarTimer();
                iniciarMonitoreo(curpRfc);
                sesionActiva = true;
            }

        } catch (error) {
            showStatus('❌ Error: ' + error.message, 'error');
            console.error('Error detallado:', error);
            btn.textContent = '🚀 Reintentar';
            btn.disabled = false;
        }
    });

    // ============================================================
    // FUNCIÓN: Extraer resultado del HTML
    // ============================================================
    function extraerResultado(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        const selectores = [
            '.resultado', '#resultado', '.result', '#result',
            '.card-body', '.content', 'table',
            '.alert-success', '.alert-info',
            '[class*="result"]', '[id*="result"]',
            '.mensaje', '#mensaje',
            '.datos', '#datos',
            '.respuesta', '#respuesta'
        ];

        for (const selector of selectores) {
            const elem = doc.querySelector(selector);
            if (elem) {
                const texto = elem.textContent.trim();
                if (texto.length > 20 && !texto.includes('CURP') && !texto.includes('RFC')) {
                    return elem.innerHTML;
                }
                if (elem.tagName === 'TABLE' && elem.querySelectorAll('tr').length > 1) {
                    return elem.innerHTML;
                }
            }
        }

        const allElements = doc.querySelectorAll('div, section, article');
        for (const elem of allElements) {
            const texto = elem.textContent.trim();
            if (texto.length > 50 && 
                (texto.includes('CURP') || texto.includes('RFC') || 
                 texto.includes('NOMBRE') || texto.includes('DATOS') ||
                 texto.match(/\d{10,}/))) {
                return elem.innerHTML;
            }
        }

        return null;
    }

    // ============================================================
    // FUNCIÓN: Mostrar resultado
    // ============================================================
    function mostrarResultado(html) {
        const resultBox = document.getElementById('resultBox');
        const resultContent = document.getElementById('resultContent');
        const timestamp = document.getElementById('resultTimestamp');

        let limpio = html.replace(/<script[\s\S]*?<\/script>/gi, '');
        limpio = limpio.replace(/<style[\s\S]*?<\/style>/gi, '');

        resultContent.innerHTML = limpio || 'No se encontró información';
        resultBox.classList.add('show');
        timestamp.textContent = '📅 Resultado obtenido: ' + new Date().toLocaleString();

        detenerMonitoreo();
        detenerTimer();
        document.getElementById('monitorInfo').classList.remove('show');
        document.getElementById('submitBtn').textContent = '✅ Completado';
        document.getElementById('submitBtn').disabled = false;

        // Sonido de notificación
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 800;
            gain.gain.value = 0.1;
            osc.start();
            setTimeout(() => osc.stop(), 200);
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.frequency.value = 1000;
                gain2.gain.value = 0.1;
                osc2.start();
                setTimeout(() => osc2.stop(), 200);
            }, 300);
        } catch(e) { /* Silencioso */ }
    }

    // ============================================================
    // FUNCIÓN: Monitoreo indefinido
    // ============================================================
    function iniciarMonitoreo(curpRfc) {
        detenerMonitoreo();

        monitorInterval = setInterval(async () => {
            try {
                const resp = await fetch(CONFIG.rastreoUrl, {
                    method: 'GET',
                    credentials: 'include'
                });

                if (resp.ok) {
                    const html = await resp.text();
                    const resultado = extraerResultado(html);

                    if (resultado) {
                        mostrarResultado(resultado);
                        showStatus('✅ ¡Resultado obtenido!', 'success');
                        detenerMonitoreo();
                        detenerTimer();
                        document.getElementById('monitorInfo').classList.remove('show');
                    } else {
                        actualizarTimer();
                    }
                }
            } catch (e) {
                console.log('Monitoreo: esperando...', e.message);
            }
        }, 5000);
    }

    // ============================================================
    // FUNCIONES: Timer de espera
    // ============================================================
    function iniciarTimer() {
        detenerTimer();
        tiempoEspera = 0;
        timerInterval = setInterval(() => {
            tiempoEspera++;
            actualizarTimer();
        }, 1000);
    }

    function actualizarTimer() {
        const hours = Math.floor(tiempoEspera / 3600);
        const minutes = Math.floor((tiempoEspera % 3600) / 60);
        const seconds = tiempoEspera % 60;
        document.getElementById('timerDisplay').textContent = 
            `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function detenerTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function detenerMonitoreo() {
        if (monitorInterval) {
            clearInterval(monitorInterval);
            monitorInterval = null;
        }
    }

    // ============================================================
    // FUNCIÓN: Mostrar estado
    // ============================================================
    function showStatus(message, type) {
        const status = document.getElementById('status');
        status.innerHTML = message;
        status.className = 'status ' + type;
        
        if (type === 'loading' || type === 'waiting') {
            const spinner = document.createElement('span');
            spinner.className = 'spinner';
            status.prepend(spinner);
        }
    }

    // ============================================================
    // FUNCIÓN: Sleep
    // ============================================================
    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // ============================================================
    // MANTENER SESIÓN ACTIVA
    // ============================================================
    setInterval(async () => {
        if (sesionActiva) {
            try {
                await fetch(CONFIG.rastreoUrl, {
                    method: 'HEAD',
                    credentials: 'include'
                });
                console.log('🔄 Sesión mantenida activa');
            } catch (e) { /* Silencioso */ }
        }
    }, 300000);

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================
    console.log('🔍 Rastreo idCIF - YODA');
    console.log('📧 Email precargado:', CONFIG.email);
    console.log('🔒 Contraseña precargada: *****');
    console.log('📌 Ingresa el CURP/RFC y presiona "Comenzar rastreo"');

    document.getElementById('curp_rfc').focus();
</script>

</body>
</html>
